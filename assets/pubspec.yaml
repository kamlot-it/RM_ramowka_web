publish_to: 'none'
version: 0.4.3-alpha

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  http: ^1.3.0
  intl: ^0.19.0
  google_fonts: ^5.0.0
